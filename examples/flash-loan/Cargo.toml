[package]
license = "MIT"
name = "flash-loan"
version = "0.1.0"
edition = "2021"
description = "Soroban example flash-loan contract that lends liquidity with a fee and enforces repayment."
keywords = ["soroban", "example", "flash-loan"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[package]
license = "MIT"
name = "oracle-consumer"
version = "0.1.0"
edition = "2021"
description = "Soroban example contract that consumes an external price oracle with freshness checks."
keywords = ["soroban", "example", "oracle-consumer"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

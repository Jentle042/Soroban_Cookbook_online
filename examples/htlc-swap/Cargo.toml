[package]
name = "htlc-swap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban example hashed timelock contract (HTLC) for atomic token swaps."
keywords = ["soroban", "example", "htlc-swap"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[package]
license = "MIT"
name = "hello-world"
version = "0.1.0"
edition = "2021"
description = "Soroban example contract that stores and returns a greeting message from instance storage."
keywords = ["soroban", "example", "hello-world"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[package]
name = "dutch-auction"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban example demonstrating a time-decaying Dutch auction with linear price interpolation."
keywords = ["soroban", "example", "dutch-auction"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

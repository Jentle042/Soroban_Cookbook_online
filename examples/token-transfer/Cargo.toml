[package]
license = "MIT"
name = "token-transfer"
version = "0.1.0"
edition = "2021"
description = "Soroban example token contract with mint, transfer, burn, and allowance operations."
keywords = ["soroban", "example", "token-transfer"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

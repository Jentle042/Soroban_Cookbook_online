[package]
license = "MIT"
name = "token-snapshot"
version = "0.1.0"
edition = "2021"
description = "Soroban example token that supports balance snapshots for off-chain indexing."
keywords = ["soroban", "example", "token-snapshot"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

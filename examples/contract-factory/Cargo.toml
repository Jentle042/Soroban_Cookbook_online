[package]
name = "contract-factory"
license = "MIT"
version = "0.1.0"
edition = "2021"
description = "Soroban example factory contract that deploys child contract instances."
keywords = ["soroban", "example", "contract-factory"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[package]
name = "escrow-multiparty"
version = "0.1.0"
edition = "2021"
description = "Soroban example multiparty escrow with depositor, recipient, and arbitrator roles."
keywords = ["soroban", "example", "escrow-multiparty"]
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

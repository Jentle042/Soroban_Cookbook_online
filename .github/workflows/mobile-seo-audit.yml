name: Mobile-First Indexing Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-seo-audit:
    name: Mobile SEO & Lighthouse Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        # Prefer Bun lockfile (canonical for this repo); npm ci fails on stale package-lock.
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run build

      - name: Serve & Audit with Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          # Prefer JSON config (staticDistDir) over lighthouserc.js server mode
          lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: ./documentation/.lighthouseci/
          retention-days: 5

  mobile-friendly-check:
    name: Mobile-Friendly Verification
    runs-on: ubuntu-latest
    needs: mobile-seo-audit
    defaults:
      run:
        working-directory: ./documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run build

      - name: Check viewport meta tag
        run: |
          if grep -r 'name="viewport"' build/; then
            echo "✅ Viewport meta tag found"
          else
            echo "❌ Viewport meta tag missing"
            exit 1
          fi

      - name: Check font-size minimum
        run: |
          # Lighthouse CI enforces font-size; keep an explicit confirmation step.
          echo "✅ Font size check delegated to Lighthouse audit"

      - name: Check tap target sizes
        working-directory: .
        run: |
          if grep -qE 'min-height:\s*44px|min-height:\s*48px|--btn-height-lg:\s*48px' src/css/mobile-menu.css src/components/buttons/buttons.module.css 2>/dev/null || grep -q 'min-height: 48px' src/css/mobile-first.css 2>/dev/null; then
            echo "✅ Touch target CSS utilities found"
          else
            echo "❌ Touch target CSS utilities missing"
            exit 1
          fi
